<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Résonance — the matter sings, you answer with a gesture. A calm musical game, free, without account. / La matière chante, tu lui réponds d’un geste. Un jeu musical apaisé, gratuit, sans compte.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060f">
  <title>Résonance</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body data-state="threshold" data-tide="see">
  <main class="scene" id="scene">
    <canvas id="matter" class="scene__matter" tabindex="0" role="application" data-i18n-attr="aria-label:matter.label" aria-describedby="whisper"></canvas>
    <canvas id="ink" class="scene__ink" aria-hidden="true"></canvas>
    <p class="whisper" id="whisper" aria-live="polite"></p>
    <div class="card" id="card" aria-live="polite"><p class="card__title" id="card-title"></p><p class="card__line" id="card-line"></p></div>
    <div class="fatal" id="fatal" role="alert" hidden></div>
  </main>

  <header class="bar" data-i18n-attr="aria-label:bar.label">
    <button type="button" class="bar__where" id="where" aria-haspopup="dialog">
      <span class="bar__label" id="where-label"></span>
      <span class="pearls" id="pearls"></span>
    </button>
    <div class="bar__end">
      <button type="button" class="pill" id="sound" aria-pressed="false" data-i18n="sound">Son</button>
      <div id="lang"></div>
    </div>
  </header>

  <section class="threshold" id="threshold" aria-labelledby="title">
    <h1 class="threshold__title" id="title">Résonance</h1>
    <p class="threshold__line" data-i18n="tagline">La matière chante. Réponds-lui.</p>
    <div class="threshold__actions">
      <button type="button" class="enter" id="begin"><span id="begin-label" data-i18n="begin">Commencer</span> <span class="enter__soft" data-i18n="withSound">avec le son</span></button>
      <button type="button" class="enter enter--quiet" id="begin-quiet" data-i18n="quiet">En silence</button>
    </div>
    <div class="threshold__more">
      <button type="button" class="link" id="go-daily"><span data-i18n="daily">La résonance du jour</span> <span class="link__badge" id="daily-badge"></span></button>
      <button type="button" class="link" id="go-free" data-i18n="free">Improviser</button>
    </div>
    <p class="threshold__how" data-i18n="how"></p>
    <p class="threshold__note" data-i18n="note"></p>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <dialog class="map" id="map" aria-labelledby="map-title">
    <form method="dialog">
      <h2 id="map-title" data-i18n="map.title">Ton voyage</h2>
      <p class="map__lede" data-i18n="map.lede"></p>
      <ol class="tides" id="tides"></ol>
      <div class="map__more">
        <button type="button" class="map__mode" id="map-daily"><span class="map__name" data-i18n="daily"></span><span class="map__state" id="map-daily-state"></span></button>
        <button type="button" class="map__mode" id="map-free"><span class="map__name" data-i18n="free"></span><span class="map__state" data-i18n="card.freeLine"></span></button>
      </div>
      <div class="map__foot">
        <button type="button" class="link link--quiet" id="reset" data-i18n="map.reset">Effacer ma progression</button>
        <span class="map__privacy" data-i18n="map.privacy"></span>
      </div>
      <button class="enter enter--small" value="close" data-i18n="map.close">Revenir</button>
    </form>
  </dialog>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
